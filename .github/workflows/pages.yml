name: Refresh prices and deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '20 23 * * *' # 每日北京时间 07:20
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: duo-games-maintenance
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Refresh China prices and generate catalogue
        run: node scripts/refresh.mjs
      - name: Validate before deployment
        run: node scripts/validate.mjs
      - name: Test catalogue rules
        run: node --test tests/*.test.mjs
      - name: Persist last successful price and date
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/steam-cache.json data/candidates.tsv site/games.json
          if ! git diff --cached --quiet; then
            git commit -m 'chore: refresh Steam China prices [skip ci]'
            git push
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy validated site
        id: deployment
        uses: actions/deploy-pages@v4
